<div class="fixed top-4 right-4 z-50 space-y-2 pointer-events-none">
    <div *ngFor="let toast of (toastService.toasts | async); trackBy: trackByToastId" class="pointer-events-auto">
        <div appUbAlert [variant]="toast.type === 'error' ? 'destructive' : 'default'"
            [class]="toastClassMap[toast.type]">
            <h5 appUbAlertTitle>{{ toast.type | titlecase }}</h5>
            <div appUbAlertDescription>
                <p>{{ toast.message }}</p>
            </div>
            <div class="absolute top-2 right-2">
                <button type="submit" (click)="toastService.remove(toast.id)"
                    class="text-current opacity-70 hover:opacity-100 transition-opacity"
                    aria-label="Close notification">
                    ✕
                </button>
            </div>
        </div>
    </div>
</div>
