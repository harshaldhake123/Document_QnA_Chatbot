<div class="container mx-auto py-12">
  <div class="max-w-md mx-auto text-center space-y-6">
    <h2 class="text-2xl font-semibold">Upload Document</h2>
    <p class="text-neutral-600">Upload a PDF to start asking questions.</p>

    <button ubButton variant="default" (click)="openUploadDialog()">Upload PDF</button>

    @if (documentId) {
      <div class="mt-4 p-3 bg-muted text-sm rounded-md">
        Selected document: <strong>{{ documentId }}</strong>
      </div>
    }
  </div>
</div>
